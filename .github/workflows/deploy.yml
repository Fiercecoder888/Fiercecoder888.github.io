name: Deploy to GitHub Pages

# 推到 main 就自动构建 + 发布到 GitHub Pages（免费域名）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── 构建 ──────────────────────────────────────────────────────
  # 这一层刻意不碰 Pages API：只用 GITHUB_TOKEN 能做的事（装依赖、构建、上传产物）。
  # 原因：POST /repos/{owner}/{repo}/pages（创建 Pages 站点）不属于 GITHUB_TOKEN 的权限范围，
  # 用了 configure-pages 的 enablement:true 会报 "Resource not accessible by integration"。
  # 站点地址直接由账号名推导，所以构建不依赖 Pages 是否已启用。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall 会用 scripts/install-sqlite-prebuild.mjs 补 better-sqlite3 预编译包
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 用户站地址固定是 https://<账号>.github.io，仓库名必须也叫 <账号>.github.io。
      # 必须转小写：GitHub 账号名可能带大写（如 Fiercecoder888），但主机名一律小写，
      # 否则 canonical / sitemap / RSS 会写成 https://Fiercecoder888.github.io，
      # 与 shared/site.ts 不一致，SEO 上会被当成两个 URL。
      - name: Resolve site url
        id: site
        run: echo "url=https://$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]').github.io" >> "$GITHUB_OUTPUT"

      # 草稿守卫：@nuxt/content 构建期不按 draft 字段过滤数据库行，draft: true 的正文
      # 会随公开可下载的 /_nuxt_content/blog/sql_dump.txt 一起泄露。构建前先拦住。
      - name: Check no drafts in content
        run: pnpm check:drafts

      # 泄露守卫：content/worklog 会直接发布到公开网站，工作日志又天然贴着工作项目写，
      # 很容易带出公司/客户/项目代号、内网地址、真实路径、密钥。这条在构建前拦住。
      # （`new-log.mjs --publish` 是把草稿直接移进 content/ 的，不走其它守卫，所以 CI 这道是必要的兜底）
      - name: Check no secrets in worklog
        run: pnpm check:leaks

      - name: Generate static site
        run: pnpm generate
        env:
          # sitemap / RSS / llms.txt / canonical 都用它
          NUXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}

      # GitHub Pages 默认跑 Jekyll，会忽略 _nuxt/ 这类下划线开头的目录
      - name: Disable Jekyll
        run: touch .output/public/.nojekyll

      - name: Show build summary
        run: |
          echo "产物大小: $(du -sh .output/public | cut -f1)"
          echo "文件数  : $(find .output/public -type f | wc -l)"
          echo "HTML 数 : $(find .output/public -name '*.html' | wc -l)"
          echo "站点地址: ${{ steps.site.outputs.url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  # ── 发布 ──────────────────────────────────────────────────────
  # 需要仓库已启用 Pages（Settings → Pages → Source 选 "GitHub Actions"）。
  # 这一步必须先手动开一次，工作流自己开不了。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
