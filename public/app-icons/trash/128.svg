      <stop offset="0" stop-color="#7c7c81"/>
      <stop offset="0.16" stop-color="#dcdce1"/>
      <stop offset="0.46" stop-color="#f8f8fb"/>
      <stop offset="0.78" stop-color="#cfcfd4"/>
